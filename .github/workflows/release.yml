name: 发布 Windows 正式版本

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的正式版本标签，例如 v2.3.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: uc-drive2-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 核对正式标签、版本和签名配置
        id: preflight
        uses: actions/github-script@v7
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          script: |
            const fs = require('node:fs');
            const tag = process.env.RELEASE_TAG;
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error('仅允许正式版本标签 vX.Y.Z');
            }
            const version = tag.slice(1);
            const notesPath = 'release-notes/' + tag + '.md';
            core.setOutput('releaseBody', fs.existsSync(notesPath) ? fs.readFileSync(notesPath, 'utf8') : '');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
            const config = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version\s*=\s*"([^"]+)"/m)?.[1];
            const cargoLock = fs.readFileSync('src-tauri/Cargo.lock', 'utf8')
              .match(/\[\[package\]\]\s+name = "uc-drive2"\s+version = "([^"]+)"/)?.[1];
            for (const [name, actual] of Object.entries({
              package: pkg.version, packageLock: lock.version, packageLockRoot: lock.packages[''].version,
              tauri: config.version, cargo, cargoLock,
            })) {
              if (actual !== version) throw new Error(name + ' 版本与标签不一致');
            }
            if (!process.env.TAURI_SIGNING_PRIVATE_KEY || !process.env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
              throw new Error('缺少更新签名私钥或密码 Secret');
            }
            if (!config.bundle.createUpdaterArtifacts || !config.plugins?.updater?.pubkey) {
              throw new Error('缺少签名更新配置');
            }
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (!data.draft) throw new Error('此版本已公开发布，禁止覆盖；请使用新版本标签');
            } catch (e) {
              if (e.status !== 404) throw e;
            }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装锁定的前端依赖
        run: npm ci

      - name: 下载并校验固定 gopeed 引擎
        shell: pwsh
        run: |
          $dependency = Get-Content -LiteralPath build-deps/gopeed.json -Raw | ConvertFrom-Json
          if ($dependency.url -ne 'https://github.com/beiyuan324/uc-drive2/releases/download/build-deps-v1/gopeed-web.exe') {
            throw '构建依赖地址不符合固定来源'
          }
          $enginePath = Join-Path $env:GITHUB_WORKSPACE 'bin/gopeed/gopeed-web.exe'
          New-Item -ItemType Directory -Path (Split-Path -Parent $enginePath) -Force | Out-Null
          Invoke-WebRequest -Uri $dependency.url -OutFile $enginePath
          $actualHash = (Get-FileHash -LiteralPath $enginePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $dependency.sha256.ToLowerInvariant()) {
            throw 'gopeed SHA-256 不匹配，停止发布'
          }

      - name: 前端类型检查
        run: npm run check

      - name: 官方网盘下载集成测试
        run: npm run test:cloud

      - name: 构建签名安装包并上传至草稿
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: 'uc-drive2 ${{ env.RELEASE_TAG }}'
          releaseBody: ${{ steps.preflight.outputs.releaseBody }}
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: 确认更新产物完整后公开发布
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            if (!Number.isSafeInteger(releaseId) || releaseId <= 0) throw new Error('缺少草稿 Release ID');
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id: releaseId });
            if (!release.draft) throw new Error('目标 Release 必须是草稿');
            if (release.tag_name !== process.env.RELEASE_TAG) throw new Error('草稿版本与目标标签不一致');
            const version = process.env.RELEASE_TAG.slice(1);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo, release_id: releaseId, per_page: 100,
            });
            const installer = assets.find(a => a.name === 'uc-drive2_' + version + '_x64-setup.exe');
            const signature = assets.find(a => a.name === installer?.name + '.sig');
            const manifest = assets.find(a => a.name === 'latest.json');
            if (![installer, signature, manifest].every(a => a && a.size > 0)) {
              throw new Error('安装包、签名或 latest.json 缺失，保留草稿');
            }
            async function readAsset(asset) {
              const response = await fetch(asset.url, {
                headers: { Authorization: 'Bearer ' + process.env.GITHUB_TOKEN, Accept: 'application/octet-stream',
                  'X-GitHub-Api-Version': '2022-11-28' },
              });
              if (!response.ok) throw new Error('无法读取草稿产物：' + asset.name);
              return response.text();
            }
            const update = JSON.parse(await readAsset(manifest));
            const platform = update.platforms?.['windows-x86_64-nsis'] || update.platforms?.['windows-x86_64'];
            const expectedUrl = 'https://github.com/' + context.repo.owner + '/' + context.repo.repo
              + '/releases/download/' + release.tag_name + '/' + installer.name;
            if (String(update.version).replace(/^v/, '') !== version || !platform
              || platform.url !== expectedUrl || !platform.signature
              || platform.signature.trim() !== (await readAsset(signature)).trim()) {
              throw new Error('更新清单版本、平台、安装包地址或签名不一致，保留草稿');
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const parts = value => value.replace(/^v/, '').split('.').map(BigInt);
            const isHigher = other => {
              const a = parts(version), b = parts(other);
              for (let i = 0; i < 3; i++) {
                if (a[i] !== b[i]) return a[i] > b[i];
              }
              return false;
            };
            const stable = releases.filter(r => r.id !== releaseId && !r.draft && !r.prerelease
              && /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(r.tag_name));
            const latest = stable.every(r => isHigher(r.tag_name));
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: releaseId, draft: false, prerelease: false,
              make_latest: latest ? 'true' : 'false',
            });
            core.info('已公开 ' + release.tag_name + (latest ? '，设为 latest' : '，保留现有 latest'));
