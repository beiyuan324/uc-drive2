[package]
name = "uc-drive2"
version = "1.1.0"
description = "uc-drive2 单用户桌面网盘"
authors = ["uc-drive2"]
edition = "2021"

[lib]
name = "uc_drive2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
