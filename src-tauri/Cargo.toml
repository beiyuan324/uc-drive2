[package]
name = "folder-drive"
version = "2.3.2"
description = "folder-drive 个人文件管理与多网盘下载工具"
authors = ["beiyuan324"]
edition = "2021"

[lib]
name = "folder_drive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"

# Rust HTTP 后端与 gopeed REST 集成
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "fs", "io-util", "process", "sync", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "json", "form", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
aes-gcm = "0.10"
base64 = "0.22"
time = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
percent-encoding = "2"
url = "2"
tauri-plugin-updater = "~2.12.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
